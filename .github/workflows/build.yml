name: build
on: [push, pull_request, workflow_dispatch]

env:
  # Modularity revision to build against. Point this to the modularity default branch once the
  # modularity milestone 1 branch is merged.
  MODULARITY_REF: ccr-0c4ae7b5-wiat19

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refabslab
        uses: actions/checkout@v4
      # modularity is a private repository: the default GITHUB_TOKEN cannot read it.
      # Add a repository secret MODULARITY_TOKEN (fine-grained PAT with read access to
      # CebbysMods/modularity contents).
      - name: Check modularity access
        env:
          MODULARITY_TOKEN: ${{ secrets.MODULARITY_TOKEN }}
        run: |
          if [ -z "$MODULARITY_TOKEN" ]; then
            echo "::error::Secret MODULARITY_TOKEN is not set; it is needed to check out the private CebbysMods/modularity repository."
            exit 1
          fi
      - name: Checkout modularity
        uses: actions/checkout@v4
        with:
          repository: CebbysMods/modularity
          ref: ${{ env.MODULARITY_REF }}
          path: .modularity
          token: ${{ secrets.MODULARITY_TOKEN }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish modularity to maven local
        working-directory: .modularity
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: Build and test refabslab
        run: ./gradlew build --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: refabslab
          path: refabslab-*/build/libs/
